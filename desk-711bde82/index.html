<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>desk</title>
  <style>
    :root { --bg: #faf7f0; --text: #26231e; --muted: #8a857b; --link: #7c4a1e; --line: #d8d2c4; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #191714; --text: #e4dfd5; --muted: #837d71; --link: #d09154; --line: #3a362f; }
    }
    body {
      max-width: 38em;
      margin: 3em auto;
      padding: 0 1.2em;
      font: 1.05rem/1.65 Charter, Georgia, serif;
      color: var(--text);
      background: var(--bg);
    }
    header { display: flex; gap: 0.7em; align-items: baseline; flex-wrap: wrap; margin-bottom: 1em; }
    select, button {
      font: 0.85rem Charter, Georgia, serif;
      color: var(--link);
      background: none;
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 0.2em 0.6em;
      cursor: pointer;
    }
    select { color: var(--text); max-width: 14em; }
    button:hover { border-color: var(--link); }
    #status { color: var(--muted); font-size: 0.8rem; margin-left: auto; font-variant-numeric: tabular-nums; }
    textarea {
      width: 100%;
      min-height: 75vh;
      font: inherit;
      line-height: 1.7;
      color: var(--text);
      background: none;
      border: none;
      resize: vertical;
      outline: none;
    }
    footer { color: var(--muted); font-size: 0.75rem; margin-top: 1.5em; }
  </style>
</head>
<body>
  <header>
    <select id="docs"></select>
    <button id="new">new</button>
    <button id="rename">rename</button>
    <button id="del">delete</button>
    <button id="download">download</button>
    <span id="status"></span>
  </header>
  <textarea id="text" spellcheck="true" placeholder="Write."></textarea>
  <footer>Synced. Drafts save to the cloud a moment after you stop typing; the word count shows a check when saved.</footer>

<script>
const API = "https://desk-sync.desk-sync.workers.dev/711bde82";
const KEY = "desk-docs";
const $ = id => document.getElementById(id);
let docs = JSON.parse(localStorage.getItem(KEY) || "null") || { "untitled": "" };
let current = localStorage.getItem(KEY + "-current");
let synced = true;

function persistLocal() {
  localStorage.setItem(KEY, JSON.stringify(docs));
  localStorage.setItem(KEY + "-current", current);
}
async function push(name) {
  try {
    await fetch(API + "/doc?name=" + encodeURIComponent(name), {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text: docs[name] }),
    });
    synced = true; count();
  } catch (e) { synced = false; count(); }
}
function renderList() {
  $("docs").innerHTML = Object.keys(docs).map(n =>
    `<option${n === current ? " selected" : ""}>${n.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</option>`).join("");
}
function load() {
  renderList();
  $("text").value = docs[current] || "";
  count();
}
function count() {
  const t = $("text").value.trim();
  const words = t ? t.split(/\s+/).length : 0;
  $("status").textContent = words + " words " + (synced ? "✓" : "…");
}

let timer;
$("text").addEventListener("input", () => {
  docs[current] = $("text").value;
  synced = false; count();
  persistLocal();
  clearTimeout(timer);
  timer = setTimeout(() => push(current), 600);
});
$("docs").addEventListener("change", () => { current = $("docs").value; persistLocal(); load(); });
$("new").addEventListener("click", () => {
  const name = prompt("Name:");
  if (!name || name in docs) return;
  docs[name] = ""; current = name; persistLocal(); push(name); load(); $("text").focus();
});
$("rename").addEventListener("click", async () => {
  const name = prompt("Rename to:", current);
  if (!name || name === current || name in docs) return;
  docs[name] = docs[current]; delete docs[current];
  await fetch(API + "/doc?name=" + encodeURIComponent(current), { method: "DELETE" }).catch(() => {});
  current = name; persistLocal(); push(name); load();
});
$("del").addEventListener("click", async () => {
  if (!confirm(`Delete "${current}"?`)) return;
  const dead = current;
  delete docs[dead];
  if (!Object.keys(docs).length) docs = { "untitled": "" };
  current = Object.keys(docs)[0]; persistLocal(); load();
  await fetch(API + "/doc?name=" + encodeURIComponent(dead), { method: "DELETE" }).catch(() => {});
});
$("download").addEventListener("click", () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([docs[current]], { type: "text/plain" }));
  a.download = current + ".txt";
  a.click();
  URL.revokeObjectURL(a.href);
});

async function boot() {
  load();
  try {
    const remote = await (await fetch(API + "/list")).json();
    // Server wins where it has content; local-only docs get pushed up.
    for (const [name, v] of Object.entries(remote)) {
      if (v.text || !(name in docs)) docs[name] = v.text;
    }
    for (const name of Object.keys(docs)) {
      if (!(name in remote)) push(name);
    }
    if (!(current in docs)) current = Object.keys(docs)[0];
    persistLocal(); load();
  } catch (e) { synced = false; count(); }
}
// Refresh from the server when the tab regains focus, so edits made
// elsewhere (or by Claude) appear without a manual reload.
window.addEventListener("focus", () => { if (synced) boot(); });
boot();
</script>
</body>
</html>
