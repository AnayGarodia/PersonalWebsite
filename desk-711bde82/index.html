<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>desk</title>
  <style>
    :root { --bg: #faf7f0; --text: #26231e; --muted: #8a857b; --link: #7c4a1e; --line: #d8d2c4; --panel: #f1ecdf; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #191714; --text: #e4dfd5; --muted: #837d71; --link: #d09154; --line: #3a362f; --panel: #201d19; }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      max-width: 36em;
      margin: 0 auto;
      padding: 2.5em 1.2em 0;
      font: 1.08rem/1.75 Charter, Georgia, serif;
      color: var(--text);
      background: var(--bg);
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex; gap: 1.1em; align-items: baseline;
      opacity: 0.35; transition: opacity 0.25s;
      margin-bottom: 2em;
      font-size: 0.82rem;
    }
    header:hover, header:focus-within { opacity: 1; }
    select {
      font: inherit; color: var(--text); background: none;
      border: none; padding: 0; max-width: 13em;
      cursor: pointer; appearance: none; -webkit-appearance: none;
    }
    header button {
      font: inherit; color: var(--muted); background: none;
      border: none; padding: 0; cursor: pointer;
    }
    header button:hover { color: var(--link); }
    #status { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
    textarea {
      flex: 1;
      width: 100%;
      font: inherit;
      color: var(--text);
      background: none;
      border: none;
      resize: none;
      outline: none;
      caret-color: var(--link);
      scrollbar-width: none;
      padding-bottom: 40vh; /* typewriter headroom: the last line never sits at the screen bottom */
    }
    textarea::-webkit-scrollbar { display: none; }
    textarea::selection { background: color-mix(in srgb, var(--link) 22%, transparent); }

    /* margin editor */
    #note {
      position: fixed;
      right: 1.2em; bottom: 1.2em;
      max-width: 22em;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0.9em 1.1em;
      font-size: 0.88rem;
      line-height: 1.55;
      box-shadow: 0 4px 20px rgba(0,0,0,0.10);
      display: none;
      white-space: pre-wrap;
    }
    #note.on { display: block; }
    #note .who { color: var(--muted); font-size: 0.75rem; margin-bottom: 0.35em; }
    #note .close { position: absolute; top: 0.4em; right: 0.7em; color: var(--muted); cursor: pointer; border: none; background: none; font: inherit; }
    #ask {
      width: 100%; margin-top: 0.7em;
      font: inherit; font-size: 0.85rem;
      color: var(--text); background: none;
      border: none; border-top: 1px solid var(--line);
      padding: 0.5em 0 0; outline: none;
    }
    #ask::placeholder { color: var(--muted); }
    #hint {
      position: fixed; right: 1.4em; bottom: 1.4em;
      color: var(--muted); font-size: 0.72rem;
      opacity: 0.5; pointer-events: none;
    }
  </style>
</head>
<body>
  <header>
    <select id="docs" title="drafts"></select>
    <button id="new">new</button>
    <button id="rename">rename</button>
    <button id="del">delete</button>
    <button id="download">download</button>
    <span id="status"></span>
  </header>
  <textarea id="text" spellcheck="false" placeholder="Write."></textarea>

  <div id="note">
    <button class="close" id="noteClose">×</button>
    <div class="who">margin</div>
    <div id="noteBody"></div>
    <input id="ask" placeholder="ask something specific… (enter)" />
  </div>
  <span id="hint">⌘K margin note</span>

<script>
const API = "https://desk-sync.desk-sync.workers.dev/711bde82";
const KEY = "desk-docs";
const $ = id => document.getElementById(id);
let docs = JSON.parse(localStorage.getItem(KEY) || "null") || { "untitled": "" };
let current = localStorage.getItem(KEY + "-current");
let synced = true;

function persistLocal() {
  localStorage.setItem(KEY, JSON.stringify(docs));
  localStorage.setItem(KEY + "-current", current);
}
async function push(name) {
  try {
    await fetch(API + "/doc?name=" + encodeURIComponent(name), {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text: docs[name] }),
    });
    synced = true; count();
  } catch (e) { synced = false; count(); }
}
function renderList() {
  $("docs").innerHTML = Object.keys(docs).map(n =>
    `<option${n === current ? " selected" : ""}>${n.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</option>`).join("");
}
function load() {
  renderList();
  $("text").value = docs[current] || "";
  count();
}
function count() {
  const t = $("text").value.trim();
  const words = t ? t.split(/\s+/).length : 0;
  $("status").textContent = words + " words " + (synced ? "✓" : "…");
}

let timer;
$("text").addEventListener("input", () => {
  docs[current] = $("text").value;
  synced = false; count();
  persistLocal();
  clearTimeout(timer);
  timer = setTimeout(() => push(current), 600);
});
$("docs").addEventListener("change", () => { current = $("docs").value; persistLocal(); load(); });
$("new").addEventListener("click", () => {
  const name = prompt("Name:");
  if (!name || name in docs) return;
  docs[name] = ""; current = name; persistLocal(); push(name); load(); $("text").focus();
});
$("rename").addEventListener("click", async () => {
  const name = prompt("Rename to:", current);
  if (!name || name === current || name in docs) return;
  docs[name] = docs[current]; delete docs[current];
  await fetch(API + "/doc?name=" + encodeURIComponent(current), { method: "DELETE" }).catch(() => {});
  current = name; persistLocal(); push(name); load();
});
$("del").addEventListener("click", async () => {
  if (!confirm(`Delete "${current}"?`)) return;
  const dead = current;
  delete docs[dead];
  if (!Object.keys(docs).length) docs = { "untitled": "" };
  current = Object.keys(docs)[0]; persistLocal(); load();
  await fetch(API + "/doc?name=" + encodeURIComponent(dead), { method: "DELETE" }).catch(() => {});
});
$("download").addEventListener("click", () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([docs[current]], { type: "text/plain" }));
  a.download = current + ".txt";
  a.click();
  URL.revokeObjectURL(a.href);
});

/* ---- margin editor (never speaks unless asked) ---- */
let lastSelection = "";
async function margin(ask) {
  const ta = $("text");
  const sel = ta.value.slice(ta.selectionStart, ta.selectionEnd) || lastSelection;
  $("note").classList.add("on");
  $("noteBody").textContent = "…";
  $("hint").style.display = "none";
  try {
    const r = await fetch(API + "/ai", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ draft: ta.value, selection: sel, ask: ask || "" }),
    });
    const d = await r.json();
    $("noteBody").textContent = d.note || d.error || "(nothing)";
  } catch (e) {
    $("noteBody").textContent = "unreachable";
  }
}
function closeNote() {
  $("note").classList.remove("on");
  $("hint").style.display = "";
  $("text").focus();
}
document.addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
    e.preventDefault();
    const ta = $("text");
    lastSelection = ta.value.slice(ta.selectionStart, ta.selectionEnd);
    margin();
  }
  if (e.key === "Escape") closeNote();
});
$("noteClose").addEventListener("click", closeNote);
$("ask").addEventListener("keydown", e => {
  if (e.key === "Enter" && $("ask").value.trim()) {
    margin($("ask").value.trim());
    $("ask").value = "";
  }
  e.stopPropagation();
});

async function boot() {
  load();
  try {
    const remote = await (await fetch(API + "/list")).json();
    for (const [name, v] of Object.entries(remote)) {
      if (v.text || !(name in docs)) docs[name] = v.text;
    }
    for (const name of Object.keys(docs)) {
      if (!(name in remote)) push(name);
    }
    if (!(current in docs)) current = Object.keys(docs)[0];
    persistLocal(); load();
  } catch (e) { synced = false; count(); }
}
window.addEventListener("focus", () => { if (synced) boot(); });
boot();
</script>
</body>
</html>
